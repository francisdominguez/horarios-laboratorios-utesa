name: Push Notifications

on:
  schedule:
    # Cada minuto de lunes a sábado, 11am–11:59pm UTC (7am–7:59pm RD)
    - cron: '* 11-23 * * 1-6'
    # Cada minuto de martes a sábado, 0am–2:59am UTC (8pm–10:59pm RD del día anterior)
    - cron: '* 0-2 * * 2-6'
  workflow_dispatch: # también se puede correr manualmente

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install web-push

      - name: Send notifications
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_EMAIL: ${{ secrets.VAPID_EMAIL }}
          SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
        run: node .github/scripts/send-notifications.js
