name: Push Notifications

on:
  schedule:
    # Corre cada minuto de Lunes a Sábado, 7am-10pm hora RD (UTC-4 = 11am-2am UTC)
    - cron: '* 11-23 * * 1-6'
    - cron: '* 0-2 * * 2-7'
  workflow_dispatch: # también se puede correr manualmente

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install web-push

      - name: Send notifications
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_EMAIL: ${{ secrets.VAPID_EMAIL }}
          SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
        run: node .github/scripts/send-notifications.js
