// .github/scripts/send-notifications.js

const path = require('path');
const webpush = require('web-push');

// Importa schedule-data.js usando __dirname para evitar problemas de ruta
const scheduleData = require(path.join(__dirname, 'schedule-data.js'));

// Configuración de VAPID desde variables de entorno
const vapidKeys = {
  publicKey: process.env.VAPID_PUBLIC_KEY,
  privateKey: process.env.VAPID_PRIVATE_KEY,
};

webpush.setVapidDetails(
  `mailto:${process.env.VAPID_EMAIL}`,
  vapidKeys.publicKey,
  vapidKeys.privateKey
);

// Parsear las suscripciones desde el secret
let subscriptions = [];
try {
  subscriptions = JSON.parse(process.env.SUBSCRIPTIONS || '[]');
} catch (err) {
  console.error('Error parseando SUBSCRIPTIONS:', err);
  subscriptions = [];
}

// Función para enviar notificaciones
async function sendNotifications() {
  const now = new Date();
  const day = now.getDay(); // 0 = domingo, 6 = sábado
  const hour = now.getHours();

  // Ignorar domingos y fuera de horario (ejemplo: 7am–10pm)
  if (day === 0 || hour < 7 || hour > 22) {
    console.log('Fuera de horario o domingo, no se envían notificaciones.');
    return;
  }

  // Obtener mensajes desde schedule-data.js
  const messages = scheduleData.getMessagesForTime(now);

  if (!messages || messages.length === 0) {
    console.log('No hay mensajes para enviar en este momento.');
    return;
  }

  for (const subscription of subscriptions) {
    for (const message of messages) {
      try {
        await webpush.sendNotification(subscription, JSON.stringify({ message }));
        console.log('Notificación enviada:', message);
      } catch (error) {
        console.error('Error enviando notificación:', error);
      }
    }
  }
}

// Ejecutar
sendNotifications();
