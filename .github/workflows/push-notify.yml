name: Push Notifications

on:
  schedule:
    - cron: '* 11-23 * * 1-6'
    - cron: '* 0-2 * * 2-6'
    - cron: '* 0-2 * * 0'
  repository_dispatch:
    types: [manual-notify]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate secrets
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ]; then echo "FIREBASE_PROJECT_ID vacio" && exit 1; fi
          if [ -z "$FIREBASE_CLIENT_EMAIL" ]; then echo "FIREBASE_CLIENT_EMAIL vacio" && exit 1; fi
          if [ -z "$FIREBASE_PRIVATE_KEY" ]; then echo "FIREBASE_PRIVATE_KEY vacio" && exit 1; fi
          if [ -z "$WORKER_URL" ]; then echo "WORKER_URL vacio" && exit 1; fi
          if [ -z "$WORKER_AUTH_TOKEN" ]; then echo "WORKER_AUTH_TOKEN vacio" && exit 1; fi
          echo "✅ Secrets presentes"
        env:
          FIREBASE_PROJECT_ID:  ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY:  ${{ secrets.FIREBASE_PRIVATE_KEY }}
          WORKER_URL:            ${{ secrets.WORKER_URL }}
          WORKER_AUTH_TOKEN:     ${{ secrets.WORKER_AUTH_TOKEN }}

      - name: Send notifications
        env:
          FIREBASE_PROJECT_ID:  ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY:  ${{ secrets.FIREBASE_PRIVATE_KEY }}
          WORKER_URL:            ${{ secrets.WORKER_URL }}
          WORKER_AUTH_TOKEN:     ${{ secrets.WORKER_AUTH_TOKEN }}
        run: node .github/scripts/send-notifications.js
